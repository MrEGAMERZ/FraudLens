services:
  - type: web
    name: fraudlens-ml
    env: python
    buildCommand: cd ml-service && pip install -r requirements.txt
    startCommand: cd ml-service && python app/main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false # You will enter this manually in the Render dashboard

  - type: web
    name: fraudlens-backend
    env: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: fraudlens-ml
          envVarKey: RENDER_EXTERNAL_URL
